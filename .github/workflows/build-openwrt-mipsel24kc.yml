name: build-openwrt-mipsel24kc

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd

      - name: Download ImmortalWrt SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/releases/24.10.2/targets/ramips/mt7621/immortalwrt-sdk-24.10.2-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          wget -O sdk.tar.zst "$SDK_URL"
          tar --zstd -xf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Add package
        run: |
          mkdir -p sdk/package/nva-udp-core
          cp -a package/nva-udp-core/* sdk/package/nva-udp-core/

      - name: Build package
        working-directory: sdk
        run: |
          make defconfig
          make package/nva-udp-core/compile V=s

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find sdk/bin/packages sdk/bin/targets -name '*nva-udp-core*.ipk' -print -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: nva-udp-core-mipsel_24kc-ipk
          path: artifacts/*.ipk
